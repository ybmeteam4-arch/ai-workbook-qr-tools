<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3155d9"><title>Word Booster</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="../../shared/feature-next-nav.css"></head><body><main class="shell">
<header><div><p class="eyebrow">Vocabulary List · Lesson 1</p><h1>Word Booster</h1><p>발음과 뜻, 예문을 익힌 뒤 확인 퀴즈를 풀어 보세요.</p></div><span id="progress" class="progress">0 / 30 학습</span></header>
<nav class="tabs"><button class="tab active" data-tab="learn">단어 학습</button><button class="tab" data-tab="quiz">확인 퀴즈</button></nav>
<section id="learnPanel"><div class="card"><div class="cardtop"><span id="counter">1 / 30</span><button id="completeBtn" class="complete">○ 학습 완료</button></div><div class="wordrow"><h2 id="word"></h2><button id="wordAudio" class="audio">🔊 발음 듣기</button></div><p id="meaning" class="meaning"></p><div class="box"><strong>영영풀이</strong><p id="definition"></p></div><div class="box"><div class="boxhead"><strong>예문</strong><button id="sentenceAudio" class="audio small">🔊 예문 듣기</button></div><p id="example"></p><p id="translation" class="translation"></p></div></div><div class="navrow"><button id="prev">← 이전</button><button id="random" class="ghost">무작위</button><button id="next">다음 →</button></div></section>
<section id="quizPanel" hidden><div id="quizStart" class="quizintro"><h2>확인 퀴즈</h2><p>무작위 10문제로 학습 내용을 확인해 보세요.</p><button id="startQuiz" class="primary">퀴즈 시작</button></div><div id="quizBox" hidden><div class="quizhead"><span id="quizCount"></span><span id="score"></span></div><div class="quizcard"><p id="quizLabel" class="eyebrow"></p><h2 id="question"></h2><button id="quizAudio" class="audio" hidden>🔊 다시 듣기</button><div id="choices" class="choices"></div><p id="feedback" class="feedback" aria-live="polite"></p><button id="nextQuestion" class="primary" hidden>다음 문제</button></div></div><div id="result" class="quizintro" hidden><h2 id="resultScore"></h2><p id="resultMessage"></p><button id="retry" class="primary">다시 풀기</button></div></section>
<audio id="wordPlayer" preload="metadata" src="assets/audio/L1_words.mp3"></audio><audio id="sentencePlayer" preload="metadata" src="assets/audio/L1_sentences.mp3"></audio></main><script src="script.js"></script><script src="../../shared/feature-next-nav.js"></script></body></html>
