name: Build Word Booster Audio
on:
  push:
    paths:
      - 'features/word-booster/audio-source.json'
      - '.github/workflows/build-word-booster-audio.yml'
      - '.github/scripts/build_word_booster_audio.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode, merge and index audio
        run: python3 .github/scripts/build_word_booster_audio.py
      - name: Commit merged files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/word-booster
          git commit -m "Word Booster 통합 음원 및 재생 구간 생성" || exit 0
          git push
